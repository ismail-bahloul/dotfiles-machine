# Entrée VFIO de référence — HP OMEN 15-en1xxx (RTX 3070 Mobile).
#
# Le fichier /boot/limine.conf est généré par limine-entry-tool. Ne copie pas
# les chemins ci-dessous tels quels : sur une nouvelle install, ils changent
# (machine-id, hash, version de kernel). La méthode fiable :
#
#   1. copier l'entrée normale `/+CachyOS/linux-cachyos` (protocol, path,
#      module_path, cmdline) ;
#   2. nommer la copie `linux-cachyos-vfio` ;
#   3. ajouter `iommu=pt vfio-pci.ids=10de:249d,10de:228b` à la fin du cmdline.
#
# C'est exactement ce que fait machine/optional/bin/.add-vfio-entry.
#
//linux-cachyos-vfio
### Manual VFIO entry - GPU passthrough
comment: GPU Passthrough (VFIO)
comment: kernel-id=linux-cachyos-vfio
protocol: linux
module_path: boot():/<machine-id>/linux-cachyos/initramfs
path: boot():/<machine-id>/linux-cachyos/vmlinuz
cmdline: quiet nowatchdog splash rw rootflags=subvol=/@ root=UUID=<root-uuid> iommu=pt vfio-pci.ids=10de:249d,10de:228b
