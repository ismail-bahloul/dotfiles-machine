# VFIO modules for the Windows VM (RTX 3070 Mobile passthrough).
# Loaded in the initramfs so the dGPU is bound to vfio-pci before the NVIDIA
# driver claims it on the VFIO boot entry. The normal entry does not pass
# vfio-pci.ids=..., so binding stays with nvidia there.
#
# This drop-in replaces the old edit of MODULES=() in /etc/mkinitcpio.conf.
# Do not also keep the modules in the main file (duplicate, harmless but
# confusing).
MODULES+=(vfio_pci vfio vfio_iommu_type1)
