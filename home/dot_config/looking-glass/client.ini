; Looking Glass client — the VM exposes its IVSHMEM buffer as
; /dev/shm/looking-glass (see etc/tmpfiles.d/looking-glass.conf).
; Without shmFile, the client defaults to /dev/kvmfr0 and exits.
[app]
shmFile=/dev/shm/looking-glass

; The guest gets keyboard/mouse through evdev passthrough; keep SPICE for
; clipboard and audio only.
[spice]
input=no

; Escape/menu key: 97 = Right Ctrl.
[input]
escapeKey=97
